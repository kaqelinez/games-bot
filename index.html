<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Игры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #14102a;
  --bg2: #1b1538;
  --surface: #221b44;
  --tile: #2e2659;
  --tile-hi: #3a3170;
  --edge: #0d0a1e;
  --line: #3b3270;
  --text: #f4f0ff;
  --muted: #a198cc;
  --x: #ff4f8b;
  --o: #35d6e6;
  --gold: #ffcf4a;
  --ink: #241a05;
  --ok: #7ce38b;
  --bad: #ff7a7a;
  --f-head: "Unbounded", "Manrope", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
body {
  font-family: var(--f-body); font-weight: 600; font-size: 15px; line-height: 1.4;
  padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  background:
    radial-gradient(120% 60% at 50% -10%, #2a2060 0%, transparent 60%),
    var(--bg);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.app { max-width: 460px; margin: 0 auto; padding: 14px 16px 120px; }

/* ---------- шапка и вкладки ---------- */
.top { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 12px; }
.brand { font-family: var(--f-head); font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
.conn { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px #7ce38b22; }
.conn.off i { background: var(--bad); box-shadow: 0 0 0 3px #ff7a7a22; }

.tabs {
  position: relative; display: grid; grid-template-columns: 1fr 1fr;
  background: var(--surface); border-radius: 18px; padding: 5px;
  box-shadow: inset 0 0 0 1px var(--line);
}
.tabs::before {
  content: ""; position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc(50% - 5px);
  background: var(--tile-hi); border-radius: 14px;
  box-shadow: 0 3px 0 var(--edge);
  transition: transform .28s cubic-bezier(.3,.9,.3,1.1);
}
.tabs[data-tab="croc"]::before { transform: translateX(100%); }
.tab {
  position: relative; z-index: 1; padding: 12px 6px; border-radius: 14px;
  font-weight: 800; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: color .2s;
}
.tab.on { color: var(--text); }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: none; }
.tab .dot.show { display: block; }

/* ---------- общие элементы ---------- */
.view { display: none; margin-top: 16px; }
.view.on { display: block; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 20px; border-radius: 16px; font-weight: 800; font-size: 15px;
  background: var(--tile-hi); box-shadow: 0 4px 0 var(--edge);
  transition: transform .08s, box-shadow .08s, filter .15s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.btn.gold { background: var(--gold); color: var(--ink); }
.btn.pink { background: var(--x); color: #fff; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px var(--line); color: var(--muted); }
.btn.ghost:active { box-shadow: inset 0 0 0 2px var(--line); transform: scale(.98); }
.btn.wide { width: 100%; }
.btn.small { padding: 10px 14px; font-size: 14px; border-radius: 13px; }
.row { display: flex; gap: 10px; margin-top: 14px; }
.row .btn { flex: 1; }

.card { background: var(--surface); border-radius: 22px; padding: 18px; box-shadow: inset 0 0 0 1px var(--line); }
.muted { color: var(--muted); }

/* ---------- крестики-нолики ---------- */
.seats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seat {
  display: flex; align-items: center; gap: 11px; min-width: 0;
  background: var(--surface); border-radius: 18px; padding: 11px 12px;
  box-shadow: inset 0 0 0 1px var(--line);
  transition: box-shadow .2s, background .2s;
}
.seat.on.X { box-shadow: inset 0 0 0 2px var(--x); background: #2b1b46; }
.seat.on.O { box-shadow: inset 0 0 0 2px var(--o); background: #1b2750; }
.seat.won.X { background: var(--x); box-shadow: none; }
.seat.won.O { background: var(--o); box-shadow: none; }
.seat.won, .seat.won small { color: #170d2b; }
.tok { width: 38px; height: 38px; border-radius: 12px; background: var(--tile); display: grid; place-items: center; flex: none; box-shadow: 0 3px 0 var(--edge); }
.tok svg { width: 22px; height: 22px; }
.seat .sn { min-width: 0; display: flex; flex-direction: column; }
.seat .sn b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.seat .sn small { color: var(--muted); font-size: 12px; font-weight: 600; }
.seat .sit { margin-left: auto; }

.status {
  text-align: center; margin: 18px 0 14px; min-height: 30px;
  font-family: var(--f-head); font-weight: 700; font-size: 17px; letter-spacing: -.01em;
}
.status.me { color: var(--gold); }
.status.win { color: var(--ok); }

.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cell {
  aspect-ratio: 1; border-radius: 20px; background: var(--tile);
  box-shadow: 0 5px 0 var(--edge); display: grid; place-items: center;
  transition: transform .08s, box-shadow .08s, background .2s, opacity .3s;
}
.cell svg { width: 56%; height: 56%; overflow: visible; }
.cell.can { background: var(--tile-hi); }
.cell.can:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--edge); }
.cell:disabled { cursor: default; }
.cell.dim { opacity: .38; }
.cell.w.X { background: #5a2347; }
.cell.w.O { background: #1c4a66; }
.mark path, .mark circle { fill: none; stroke-width: 11; stroke-linecap: round; }
.mark.X { stroke: var(--x); } .mark.O { stroke: var(--o); }
.mark.new path, .mark.new circle { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .38s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.cell.w .mark { animation: pop .5s ease-out 2; }
@keyframes pop { 50% { transform: scale(1.18); } }

.note { text-align: center; color: var(--muted); font-size: 13px; margin-top: 14px; }

/* ---------- крокодил ---------- */
.hero { text-align: center; padding: 26px 18px 22px; }
.hero .big { font-size: 54px; line-height: 1; }
.hero h2 { font-family: var(--f-head); font-weight: 800; font-size: 24px; margin: 12px 0 6px; letter-spacing: -.02em; }
.hero p { margin: 0 auto 18px; color: var(--muted); max-width: 30ch; }

.result {
  border-radius: 18px; padding: 14px 16px; margin-bottom: 14px; font-weight: 700;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
}
.result.win { background: #1f3a2f; box-shadow: inset 0 0 0 1px #3c7a5a; }

.wordcard {
  background: var(--gold); color: var(--ink); border-radius: 24px; padding: 20px 18px 22px; text-align: center;
  box-shadow: 0 6px 0 #b98b14;
}
.wordcard small { font-weight: 700; opacity: .75; }
.wordcard .word {
  font-family: var(--f-head); font-weight: 800; font-size: clamp(26px, 9vw, 38px);
  letter-spacing: -.02em; margin: 8px 0 0; word-break: break-word; line-height: 1.1;
}
.lead-info { display: flex; align-items: center; gap: 12px; }
.lead-info .tok { background: var(--gold); font-size: 20px; }
.lead-info b { display: block; }
.lead-info span { color: var(--muted); font-size: 13px; }

.log { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; max-height: 38vh; overflow-y: auto; padding-right: 2px; }
.log:empty { display: none; }
.bub { background: var(--surface); border-radius: 16px 16px 16px 5px; padding: 9px 13px; align-self: flex-start; max-width: 88%; box-shadow: inset 0 0 0 1px var(--line); }
.bub.mine { align-self: flex-end; background: var(--tile-hi); border-radius: 16px 16px 5px 16px; }
.bub small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
.bub span { overflow-wrap: anywhere; }

.guess {
  position: fixed; left: 0; right: 0; bottom: 0; display: none;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.guess.show { display: block; }
.guess form { max-width: 460px; margin: 0 auto; display: flex; gap: 8px; }
.guess input {
  flex: 1; min-width: 0; padding: 14px 16px; border-radius: 16px; border: 0;
  background: var(--surface); box-shadow: inset 0 0 0 2px var(--line); outline: none; font-weight: 700;
}
.guess input:focus { box-shadow: inset 0 0 0 2px var(--gold); }
.guess input::placeholder { color: var(--muted); }
.guess .btn { padding: 14px 18px; }

.top5 { margin-top: 20px; }
.top5 h3 { font-family: var(--f-head); font-size: 15px; font-weight: 700; margin: 0 0 10px 2px; }
.top5 ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.top5 li { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 14px; padding: 10px 14px; box-shadow: inset 0 0 0 1px var(--line); }
.top5 .m { width: 26px; text-align: center; font-size: 18px; }
.top5 .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top5 .p { font-family: var(--f-head); font-weight: 700; color: var(--gold); }
.top5 .empty { color: var(--muted); padding: 4px 2px; }

/* ---------- тост и блокирующий экран ---------- */
.toast {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0)); transform: translate(-50%, -140%);
  background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-weight: 800; font-size: 14px;
  transition: transform .3s cubic-bezier(.3,.9,.3,1.1); z-index: 20; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { transform: translate(-50%, 0); }
.fatal {
  position: fixed; inset: 0; z-index: 30; background: var(--bg); display: none;
  align-items: center; justify-content: center; text-align: center; padding: 30px;
}
.fatal.show { display: flex; }
.fatal .big { font-size: 56px; }
.fatal h2 { font-family: var(--f-head); font-size: 21px; margin: 14px 0 8px; }
.fatal p { color: var(--muted); max-width: 32ch; margin: 0 auto; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .mark.new path, .mark.new circle { stroke-dashoffset: 0; }
}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div class="brand">Игры</div>
    <div class="conn" id="conn"><i></i><span>онлайн</span></div>
  </div>

  <div class="tabs" id="tabs" data-tab="xo" role="tablist">
    <button class="tab on" data-tab="xo" role="tab" aria-selected="true">Крестики-нолики <span class="dot" id="dotXo"></span></button>
    <button class="tab" data-tab="croc" role="tab" aria-selected="false">Крокодил <span class="dot" id="dotCroc"></span></button>
  </div>

  <!-- Крестики-нолики -->
  <section class="view on" id="v-xo">
    <div class="seats" id="seats"></div>
    <div class="status" id="status"></div>
    <div class="board" id="board"></div>
    <div id="xoActions"></div>
  </section>

  <!-- Крокодил -->
  <section class="view" id="v-croc">
    <div id="crocMain"></div>
    <div class="log" id="log"></div>
    <div class="top5" id="top5"></div>
  </section>
</div>

<div class="guess" id="guessBar">
  <form id="guessForm" autocomplete="off">
    <input id="guessInput" type="text" maxlength="60" placeholder="Твой вариант слова" enterkeyhint="send" aria-label="Твой вариант слова">
    <button class="btn gold" type="submit">Ответить</button>
  </form>
</div>

<div class="toast" id="toast" role="status"></div>
<div class="fatal" id="fatal">
  <div>
    <div class="big" id="fatalIcon">🎮</div>
    <h2 id="fatalTitle"></h2>
    <p id="fatalText"></p>
  </div>
</div>

<script>
(() => {
  "use strict";
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try {
      tg.ready(); tg.expand();
      tg.setHeaderColor("#14102a"); tg.setBackgroundColor("#14102a");
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    } catch (e) {}
  }
  const INIT = (tg && tg.initData) || "";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  let S = null, lastJson = "", tab = "xo";
  let seq = 0, applied = 0, fatal = false;
  let prevBoard = Array(9).fill(""), prevWin, prevLogLen = -1;

  try { const t = localStorage.getItem("tab"); if (t === "croc") tab = "croc"; } catch (e) {}

  /* ---------- вспомогательное ---------- */
  const haptic = (kind, v) => { try { tg && tg.HapticFeedback && tg.HapticFeedback[kind](v); } catch (e) {} };
  let toastTimer;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }
  function setConn(ok) {
    $("conn").classList.toggle("off", !ok);
    $("conn").lastElementChild.textContent = ok ? "онлайн" : "нет связи";
  }
  function showFatal(icon, title, text) {
    fatal = true;
    $("fatalIcon").textContent = icon; $("fatalTitle").textContent = title; $("fatalText").textContent = text;
    $("fatal").classList.add("show");
  }

  /* ---------- запросы ---------- */
  async function call(a, v) {
    if (fatal) return;
    const id = ++seq;
    try {
      const r = await fetch("/api", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ init: INIT, a: a, v: v }),
      });
      const data = await r.json().catch(() => ({}));
      setConn(true);
      if (!r.ok) {
        if (r.status === 401) showFatal("💬", "Открой игры из чата", "Нажми кнопку «Открыть игры» в групповом чате, где работает бот.");
        else if (r.status === 403) showFatal("🚫", "Доступ закрыт", data.error || "Недоступно");
        else if (a) toast(data.error || "Что-то пошло не так");
        return;
      }
      if (id > applied) { applied = id; S = data; render(); }
    } catch (e) {
      setConn(false);
      if (a) toast("Нет связи, попробуй ещё раз");
    }
  }
  const act = (a, v) => call(a, v);

  /* ---------- SVG ---------- */
  const svgX = (cls = "") => `<svg class="mark X ${cls}" viewBox="0 0 100 100"><path pathLength="1" d="M24 24L76 76M76 24L24 76"/></svg>`;
  const svgO = (cls = "") => `<svg class="mark O ${cls}" viewBox="0 0 100 100"><circle pathLength="1" cx="50" cy="50" r="28"/></svg>`;
  const markSvg = (s, cls) => (s === "X" ? svgX(cls) : svgO(cls));

  /* ---------- крестики-нолики ---------- */
  function winLine(b) {
    for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) return l;
    return null;
  }

  function renderXO() {
    const xo = S.xo, me = S.me, P = xo.p || {};
    const ids = Object.values(P).map((p) => p[0]);
    const iAm = ids.includes(me), full = ids.length === 2;
    const mySym = P.X && P.X[0] === me ? "X" : P.O && P.O[0] === me ? "O" : null;
    const win = xo.win;
    const myTurn = full && !win && P[xo.turn] && P[xo.turn][0] === me;

    // места игроков
    $("seats").innerHTML = ["X", "O"].map((sym) => {
      const p = P[sym];
      const cls = ["seat", sym];
      if (full && !win && xo.turn === sym) cls.push("on");
      if (win === sym) cls.push("won");
      let body;
      if (p) {
        body = `<div class="sn"><b>${esc(p[1])}</b><small>${p[0] === me ? "это ты" : (win === sym ? "победа" : "играет")}</small></div>`;
      } else if (!iAm) {
        body = `<div class="sn"><b class="muted">Свободно</b></div><button class="btn small gold sit" data-act="xo_join">Сесть</button>`;
      } else {
        body = `<div class="sn"><b class="muted">Ждём…</b><small>соперника</small></div>`;
      }
      return `<div class="${cls.join(" ")}"><span class="tok">${markSvg(sym)}</span>${body}</div>`;
    }).join("");

    // статус
    let st = "", sc = "status";
    if (win === "draw") st = "Ничья 🤝";
    else if (win) { const wp = P[win]; if (wp && wp[0] === me) { st = "Ты победил 🔥"; sc += " win"; } else st = `Победил ${wp ? wp[1] : win}`; }
    else if (!full) st = iAm ? "Ждём второго игрока" : "Нужен соперник";
    else if (myTurn) { st = "Твой ход"; sc += " me"; }
    else st = `Ходит ${P[xo.turn][1]}`;
    $("status").className = sc;
    $("status").textContent = st;

    // поле
    const wl = typeof win === "string" && win !== "draw" ? winLine(xo.b) : null;
    $("board").innerHTML = xo.b.map((v, i) => {
      const cls = ["cell"];
      const can = myTurn && !v;
      if (can) cls.push("can");
      if (wl) cls.push(wl.includes(i) ? "w " + v : "dim");
      const isNew = v && !prevBoard[i];
      return `<button class="${cls.join(" ")}" data-act="xo_move" data-v="${i}" ${can ? "" : "disabled"} aria-label="Клетка ${i + 1}">${v ? markSvg(v, isNew ? "new" : "") : ""}</button>`;
    }).join("");

    // кнопки под полем
    let acts = "";
    if (win && iAm) {
      acts = `<div class="row"><button class="btn gold" data-act="xo_reset">Сыграть ещё</button><button class="btn ghost" data-act="xo_leave">Выйти</button></div>`;
    } else if (!win && iAm && !full) {
      acts = `<div class="row"><button class="btn ghost" data-act="xo_leave">Выйти из-за стола</button></div><div class="note">Скажи другу открыть игры в этом чате</div>`;
    } else if (!iAm && full && !win) {
      acts = `<div class="note">Идёт партия — ты наблюдаешь</div>`;
    } else if (!iAm && win) {
      acts = `<div class="note">Партия окончена. Ждём, пока игроки начнут заново.</div>`;
    }
    $("xoActions").innerHTML = acts;

    // вибрация по итогам партии
    if (prevWin !== undefined && !prevWin && win) {
      if (win === "draw") haptic("notificationOccurred", "warning");
      else if (mySym === win) haptic("notificationOccurred", "success");
      else if (mySym) haptic("notificationOccurred", "error");
    }
    prevWin = win; prevBoard = xo.b.slice();
    $("dotXo").classList.toggle("show", !!myTurn && tab !== "xo");
  }

  /* ---------- крокодил ---------- */
  function renderCroc() {
    const c = S.croc, me = S.me;
    const isLead = c.active && c.leader && c.leader[0] === me;
    let h = "";

    if (!c.active) {
      if (c.msg) h += `<div class="result ${c.msg.startsWith("🎉") ? "win" : ""}">${esc(c.msg)}</div>`;
      h += `<div class="card hero">
        <div class="big">🐊</div>
        <h2>Крокодил</h2>
        <p>Ведущий объясняет загаданное слово в чате, остальные угадывают.</p>
        <button class="btn gold wide" data-act="croc_lead">Стать ведущим</button>
      </div>`;
    } else if (isLead) {
      h += `<div class="wordcard"><small>Твоё слово — объясняй в чате, не называя его</small><div class="word">${esc(c.word || "")}</div></div>
        <div class="row"><button class="btn" data-act="croc_new">Другое слово</button><button class="btn ghost" data-act="croc_giveup">Сдаться</button></div>`;
    } else {
      h += `<div class="card"><div class="lead-info"><span class="tok">🎤</span><div><b>${esc(c.leader ? c.leader[1] : "")}</b><span>объясняет слово. Пиши варианты ниже</span></div></div></div>`;
    }
    $("crocMain").innerHTML = h;

    // варианты игроков
    const log = c.log || [];
    $("log").innerHTML = c.active ? log.map((m) =>
      `<div class="bub ${m[0] === myName() ? "mine" : ""}"><small>${esc(m[0])}</small><span>${esc(m[1])}</span></div>`).join("") : "";
    if (log.length !== prevLogLen) { const el = $("log"); el.scrollTop = el.scrollHeight; prevLogLen = log.length; }

    // топ
    const sc = S.scores || [];
    const medals = ["🥇", "🥈", "🥉"];
    $("top5").innerHTML = `<h3>Топ крокодила</h3>` + (sc.length
      ? `<ol>${sc.map((r, i) => `<li><span class="m">${medals[i] || i + 1}</span><span class="n">${esc(r[0])}</span><span class="p">${r[1]}</span></li>`).join("")}</ol>`
      : `<div class="top5 empty muted">Пока нет очков. Первым угадай слово.</div>`);

    $("dotCroc").classList.toggle("show", c.active && !isLead && tab !== "croc");
    updateGuessBar();
  }

  // имя игрока в логе совпадает с тем, что сохранил сервер (с префиксом) — берём из состояния
  function myName() {
    if (!S) return "";
    const seat = Object.values((S.xo && S.xo.p) || {}).find((p) => p[0] === S.me);
    if (seat) return seat[1];
    if (S.croc.leader && S.croc.leader[0] === S.me) return S.croc.leader[1];
    const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    return u ? `${u.first_name || ""} ${u.last_name || ""}`.trim() : "";
  }

  function updateGuessBar() {
    const c = S && S.croc;
    const show = tab === "croc" && c && c.active && c.leader && c.leader[0] !== S.me;
    $("guessBar").classList.toggle("show", !!show);
  }

  /* ---------- общий рендер ---------- */
  function render() {
    const j = JSON.stringify(S);
    if (j === lastJson) return;
    lastJson = j;
    renderXO(); renderCroc();
  }

  function setTab(t) {
    tab = t;
    try { localStorage.setItem("tab", t); } catch (e) {}
    $("tabs").dataset.tab = t;
    document.querySelectorAll(".tab").forEach((b) => {
      const on = b.dataset.tab === t;
      b.classList.toggle("on", on); b.setAttribute("aria-selected", on);
    });
    $("v-xo").classList.toggle("on", t === "xo");
    $("v-croc").classList.toggle("on", t === "croc");
    if (S) { $("dotXo").classList.remove("show"); $("dotCroc").classList.remove("show"); lastJson = ""; render(); }
    haptic("selectionChanged");
  }

  /* ---------- события ---------- */
  document.addEventListener("click", (e) => {
    const tabBtn = e.target.closest(".tab");
    if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const a = b.dataset.act;
    if (a === "xo_move") { haptic("impactOccurred", "light"); return act(a, Number(b.dataset.v)); }
    if (a === "croc_giveup" && !confirm("Сдаться и показать слово?")) return;
    haptic("impactOccurred", "medium");
    act(a);
  });

  $("guessForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const inp = $("guessInput"), t = inp.value.trim();
    if (!t) return;
    inp.value = "";
    haptic("impactOccurred", "light");
    act("croc_guess", t);
  });

  /* ---------- запуск ---------- */
  setTab(tab);
  if (!INIT) {
    showFatal("💬", "Открой игры из чата", "Нажми кнопку «Открыть игры» в групповом чате, где работает бот.");
  } else {
    call();
    setInterval(() => { if (!document.hidden) call(); }, 1500);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) call(); });
  }
})();
</script>
</body>
</html>
